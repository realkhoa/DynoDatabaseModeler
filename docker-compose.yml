# ==============================================================================
# DynoDbModeler Multi-Database Test Environment
# ==============================================================================
# Provides complete relational and NoSQL database engines with automated schema
# seeding and web management UI for DynoDbModeler testing and development.
#
# Every published port is bound to 127.0.0.1 only: these containers use well-known
# development credentials, so they must not be reachable from the local network.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dyno-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dyno_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dyno_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-dyno_test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dyno_user} -d ${POSTGRES_DB:-dyno_test}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dyno-net

  # ----------------------------------------------------------------------------
  # MySQL 8.4 LTS
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: dyno-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dyno_root_password_123}
      MYSQL_USER: ${MYSQL_USER:-dyno_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dyno_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dyno_test}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - dyno-net

  # ----------------------------------------------------------------------------
  # MariaDB 11.4
  # ----------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    container_name: dyno-mariadb
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-dyno_root_password_123}
      MARIADB_USER: ${MARIADB_USER:-dyno_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-dyno_password_123}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-dyno_test}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/init/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - dyno-net

  # ----------------------------------------------------------------------------
  # Microsoft SQL Server 2022
  # ----------------------------------------------------------------------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dyno-mssql
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DynoPassword123!}
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - dyno-net

  # ----------------------------------------------------------------------------
  # MSSQL Database & Schema Initializer (One-shot migration worker)
  # ----------------------------------------------------------------------------
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dyno-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /init/01-init.sql
        echo "MSSQL schema initialized successfully."
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DynoPassword123!}
    volumes:
      - ./docker/init/mssql:/init:ro
    restart: "no"
    networks:
      - dyno-net

  # ----------------------------------------------------------------------------
  # MongoDB 7.0
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: dyno-mongo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-dyno_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-dyno_password_123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-dyno_test}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dyno-net

  # ----------------------------------------------------------------------------
  # Redis 7 (Alpine)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dyno-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dyno_password_123}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-dyno_password_123} ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dyno-net

  # ----------------------------------------------------------------------------
  # Adminer (Web Database Management UI)
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: dyno-adminer
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - dyno-net

volumes:
  postgres_data:
    name: dyno_postgres_data
  mysql_data:
    name: dyno_mysql_data
  mariadb_data:
    name: dyno_mariadb_data
  mssql_data:
    name: dyno_mssql_data
  mongo_data:
    name: dyno_mongo_data
  redis_data:
    name: dyno_redis_data

networks:
  dyno-net:
    name: dyno-database-network
    driver: bridge
